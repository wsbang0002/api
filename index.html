<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 여행 일정 플래너</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Sans KR & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons (아이콘용) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-primary-100 selection:text-primary-700">

    <!-- 모바일 최적화 메인 컨테이너 (최대 너비 제한 및 중앙 정렬) -->
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl shadow-slate-200/60 flex flex-col relative pb-12">
        
        <!-- 상단 헤더 -->
        <header class="sticky top-0 z-20 bg-white/80 backdrop-blur-md border-b border-slate-100 px-5 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-primary-600 to-indigo-400 flex items-center justify-center text-white shadow-md shadow-primary-500/20">
                    <i data-lucide="compass" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-slate-900 leading-none">트립메이커 AI</h1>
                    <p class="text-[11px] text-slate-500 mt-1 font-medium">나만의 맞춤형 여행 코스</p>
                </div>
            </div>
            <span id="demo-badge" class="hidden text-[11px] font-semibold bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full">
                예시 모드
            </span>
        </header>

        <!-- 입력 폼 섹션 -->
        <main class="px-5 pt-6 flex-1">
            <form id="trip-form" class="space-y-5">
                
                <!-- 1. 여행지 입력 -->
                <div>
                    <label for="destination" class="block text-sm font-bold text-slate-700 mb-1.5 flex items-center gap-1.5">
                        <i data-lucide="map-pin" class="w-4 h-4 text-primary-600"></i>
                        어디로 떠나시나요?
                    </label>
                    <input type="text" id="destination" name="destination" required
                        placeholder="예: 제주도, 도쿄, 강릉, 파리"
                        class="w-full px-4 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:bg-white transition-all text-base">
                </div>

                <!-- 2. 여행 기간 선택 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2 flex items-center gap-1.5">
                        <i data-lucide="calendar" class="w-4 h-4 text-primary-600"></i>
                        여행 기간
                    </label>
                    <div class="grid grid-cols-4 gap-2" id="duration-group">
                        <button type="button" data-value="당일치기" class="duration-btn py-2.5 px-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-all">당일치기</button>
                        <button type="button" data-value="1박 2일" class="duration-btn py-2.5 px-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-all">1박 2일</button>
                        <button type="button" data-value="2박 3일" class="duration-btn py-2.5 px-2 rounded-xl border-2 border-primary-600 bg-primary-50 text-xs font-bold text-primary-700 transition-all">2박 3일</button>
                        <button type="button" data-value="3박 4일" class="duration-btn py-2.5 px-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-all">3박 4일</button>
                    </div>
                    <input type="hidden" id="duration" value="2박 3일">
                </div>

                <!-- 3. 누구와 가는지 선택 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2 flex items-center gap-1.5">
                        <i data-lucide="users" class="w-4 h-4 text-primary-600"></i>
                        누구와 함께하나요?
                    </label>
                    <div class="grid grid-cols-3 gap-2" id="companion-group">
                        <button type="button" data-value="혼자서" class="companion-btn py-2.5 px-3 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-all flex items-center justify-center gap-1.5">
                            <span>🧍</span> 혼자서
                        </button>
                        <button type="button" data-value="연인과" class="companion-btn py-2.5 px-3 rounded-xl border-2 border-primary-600 bg-primary-50 text-xs font-bold text-primary-700 transition-all flex items-center justify-center gap-1.5">
                            <span>💑</span> 연인과
                        </button>
                        <button type="button" data-value="친구와" class="companion-btn py-2.5 px-3 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-all flex items-center justify-center gap-1.5">
                            <span>👯</span> 친구와
                        </button>
                        <button type="button" data-value="아이와 함께" class="companion-btn py-2.5 px-3 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-all flex items-center justify-center gap-1.5">
                            <span>👶</span> 아이와
                        </button>
                        <button type="button" data-value="부모님과" class="companion-btn py-2.5 px-3 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-all flex items-center justify-center gap-1.5">
                            <span>👨‍👩‍👧</span> 부모님과
                        </button>
                        <button type="button" data-value="반려동물과" class="companion-btn py-2.5 px-3 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-all flex items-center justify-center gap-1.5">
                            <span>🐶</span> 반려동물
                        </button>
                    </div>
                    <input type="hidden" id="companion" value="연인과">
                </div>

                <!-- 4. 관심사 (다중 선택) -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2 flex items-center justify-between">
                        <span class="flex items-center gap-1.5">
                            <i data-lucide="sparkles" class="w-4 h-4 text-primary-600"></i>
                            여행 테마 / 관심사
                        </span>
                        <span class="text-[11px] font-normal text-slate-400">중복 선택 가능</span>
                    </label>
                    <div class="flex flex-wrap gap-2" id="interest-group">
                        <button type="button" data-value="맛집 탐방" class="interest-btn px-3.5 py-2 rounded-full border-2 border-primary-600 bg-primary-50 text-xs font-bold text-primary-700 transition-all">🍽️ 맛집 탐방</button>
                        <button type="button" data-value="감성 카페" class="interest-btn px-3.5 py-2 rounded-full border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-all">☕ 감성 카페</button>
                        <button type="button" data-value="자연/힐링" class="interest-btn px-3.5 py-2 rounded-full border-2 border-primary-600 bg-primary-50 text-xs font-bold text-primary-700 transition-all">🌿 자연/힐링</button>
                        <button type="button" data-value="액티비티" class="interest-btn px-3.5 py-2 rounded-full border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-all">🏄 액티비티</button>
                        <button type="button" data-value="문화/예술" class="interest-btn px-3.5 py-2 rounded-full border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-all">🎨 문화/예술</button>
                        <button type="button" data-value="쇼핑" class="interest-btn px-3.5 py-2 rounded-full border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-all">🛍️ 쇼핑</button>
                        <button type="button" data-value="인생샷 명소" class="interest-btn px-3.5 py-2 rounded-full border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-all">📸 인생샷</button>
                    </div>
                </div>

                <!-- 제출 버튼 -->
                <div class="pt-2">
                    <button type="submit" id="submit-btn"
                        class="w-full py-4 px-6 rounded-2xl bg-primary-600 hover:bg-primary-700 active:scale-[0.98] text-white font-bold text-base shadow-lg shadow-primary-600/30 transition-all flex items-center justify-center gap-2">
                        <i data-lucide="wand-2" class="w-5 h-5"></i>
                        <span>AI 맞춤 일정 만들기</span>
                    </button>
                </div>
            </form>

            <!-- 메시지 알림 박스 (alert 대체용) -->
            <div id="toast-message" class="hidden mt-4 p-3.5 rounded-2xl bg-slate-800 text-white text-xs font-medium flex items-center gap-2.5 shadow-lg transition-all">
                <i data-lucide="info" class="w-4 h-4 text-amber-400 shrink-0"></i>
                <span id="toast-text">알림 메시지</span>
            </div>

            <!-- 로딩 스켈레톤 UI -->
            <div id="loading-section" class="hidden mt-8 space-y-4">
                <div class="flex flex-col items-center justify-center py-6 text-center">
                    <div class="w-10 h-10 border-4 border-primary-100 border-t-primary-600 rounded-full animate-spin mb-3"></div>
                    <p class="text-sm font-bold text-slate-800" id="loading-title">최적의 동선을 계산하고 있어요...</p>
                    <p class="text-xs text-slate-500 mt-1">잠시만 기다려 주세요 ✨</p>
                </div>
                <!-- 스켈레톤 카드 -->
                <div class="p-5 rounded-3xl border border-slate-100 bg-slate-50/50 space-y-3 animate-pulse">
                    <div class="h-5 bg-slate-200 rounded-lg w-1/3"></div>
                    <div class="h-4 bg-slate-200 rounded-lg w-3/4"></div>
                    <div class="space-y-2 pt-2">
                        <div class="h-12 bg-slate-200 rounded-xl w-full"></div>
                        <div class="h-12 bg-slate-200 rounded-xl w-full"></div>
                    </div>
                </div>
            </div>

            <!-- 결과 일정 영역 -->
            <section id="result-section" class="hidden mt-8 pt-6 border-t border-slate-100">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <span class="text-xs font-bold text-primary-600 uppercase tracking-wider">Itinerary</span>
                        <h2 id="result-header" class="text-xl font-bold text-slate-900 mt-0.5">추천 여행 일정</h2>
                    </div>
                    <button type="button" id="copy-btn" class="p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors flex items-center gap-1.5 text-xs font-semibold">
                        <i data-lucide="copy" class="w-4 h-4"></i>
                        <span>일정 복사</span>
                    </button>
                </div>

                <!-- 안내 배너 (예시 데이터 표시 중일 때 노출) -->
                <div id="fallback-notice" class="hidden mb-5 p-3.5 rounded-2xl bg-amber-50 border border-amber-200/80 text-amber-900 text-xs leading-relaxed flex items-start gap-2.5">
                    <i data-lucide="sparkles" class="w-4 h-4 text-amber-600 shrink-0 mt-0.5"></i>
                    <div>
                        <p class="font-bold">현재 예시 일정이 표시되고 있습니다.</p>
                        <p class="text-amber-700 mt-0.5">Vercel 함수(<code class="bg-amber-100 px-1 rounded">/api/plan</code>)가 연결되면 입력하신 조건에 맞춘 실시간 Gemini 일정이 생성됩니다.</p>
                    </div>
                </div>

                <!-- 하루별 카드 리스트 컨테이너 -->
                <div id="itinerary-cards" class="space-y-5">
                    <!-- 자바스크립트로 카드가 동적 생성됩니다 -->
                </div>
            </section>
        </main>
    </div>

    <script>
        // Lucide 아이콘 초기화
        lucide.createIcons();

        // 상태 관리 객체
        const state = {
            duration: '2박 3일',
            companion: '연인과',
            interests: ['맛집 탐방', '자연/힐링']
        };

        // DOM 요소 참조
        const form = document.getElementById('trip-form');
        const destinationInput = document.getElementById('destination');
        const submitBtn = document.getElementById('submit-btn');
        const loadingSection = document.getElementById('loading-section');
        const resultSection = document.getElementById('result-section');
        const resultHeader = document.getElementById('result-header');
        const itineraryCards = document.getElementById('itinerary-cards');
        const fallbackNotice = document.getElementById('fallback-notice');
        const demoBadge = document.getElementById('demo-badge');
        const copyBtn = document.getElementById('copy-btn');
        const toastMessage = document.getElementById('toast-message');
        const toastText = document.getElementById('toast-text');

        // 커스텀 알림 메시지 표시 함수 (alert 대체)
        let toastTimeout;
        function showToast(msg) {
            toastText.textContent = msg;
            toastMessage.classList.remove('hidden');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastMessage.classList.add('hidden');
            }, 3500);
        }

        // 단일 선택 버튼 그룹 핸들러 (기간, 동행자)
        function setupSingleSelect(selector, stateKey) {
            const buttons = document.querySelectorAll(selector);
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    // 모든 버튼 스타일 초기화
                    buttons.forEach(b => {
                        b.className = b.className
                            .replace('border-2 border-primary-600 bg-primary-50 text-primary-700 font-bold', 'border border-slate-200 text-slate-600 font-semibold hover:bg-slate-50');
                    });
                    // 선택된 버튼 강조
                    btn.className = btn.className
                        .replace('border border-slate-200 text-slate-600 font-semibold hover:bg-slate-50', 'border-2 border-primary-600 bg-primary-50 text-primary-700 font-bold');
                    
                    state[stateKey] = btn.dataset.value;
                });
            });
        }

        setupSingleSelect('.duration-btn', 'duration');
        setupSingleSelect('.companion-btn', 'companion');

        // 다중 선택 버튼 그룹 핸들러 (관심사)
        const interestButtons = document.querySelectorAll('.interest-btn');
        interestButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const val = btn.dataset.value;
                const isSelected = state.interests.includes(val);

                if (isSelected) {
                    if (state.interests.length === 1) {
                        showToast('최소 1개 이상의 관심사를 선택해 주세요.');
                        return;
                    }
                    state.interests = state.interests.filter(item => item !== val);
                    btn.className = 'interest-btn px-3.5 py-2 rounded-full border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-all';
                } else {
                    state.interests.push(val);
                    btn.className = 'interest-btn px-3.5 py-2 rounded-full border-2 border-primary-600 bg-primary-50 text-xs font-bold text-primary-700 transition-all';
                }
            });
        });

        // 예시 일정 데이터 생성기 (API 연결 전 폴백용)
        function getMockItinerary(destination, duration, companion, interests) {
            const dest = destination.trim() || '제주도';
            const mainInterest = interests[0] || '맛집 탐방';
            
            // 기간에 따른 일수 계산
            let daysCount = 3;
            if (duration === '당일치기') daysCount = 1;
            else if (duration === '1박 2일') daysCount = 2;
            else if (duration === '2박 3일') daysCount = 3;
            else if (duration === '3박 4일') daysCount = 4;

            const fullMockDays = [
                {
                    day: 1,
                    title: `${dest} 도착 및 핵심 명소 탐방`,
                    summary: `${companion} 함께 설레는 첫날! 대표 랜드마크와 로컬 맛집 위주 코스`,
                    activities: [
                        { time: '11:30', place: `${dest} 현지인 추천 로컬 맛집`, desc: `여행의 시작을 여는 든든한 첫 식사 (${mainInterest} 추천)` },
                        { time: '14:00', place: `${dest} 대표 랜드마크 & 산책로`, desc: `${companion} 여유롭게 걸으며 기념사진 남기기 좋은 필수 코스` },
                        { time: '16:30', place: '오션뷰 / 시티뷰 감성 카페', desc: '시그니처 음료와 디저트를 즐기며 잠시 휴식' },
                        { time: '19:00', place: '야경 명소 및 저녁 식사', desc: '분위기 좋은 레스토랑에서 하루를 마무리하는 만찬' }
                    ]
                },
                {
                    day: 2,
                    title: `${interests.join(' & ')} 집중 투어`,
                    summary: `취향을 100% 반영한 알찬 하루 일정`,
                    activities: [
                        { time: '10:00', place: '브런치 카페 또는 아침 시장 투어', desc: '상쾌한 아침 공기와 함께 즐기는 가벼운 아침 식사' },
                        { time: '12:30', place: `${dest} 숨은 명소 & 테마 체험`, desc: `${interests[1] || mainInterest} 매력을 제대로 느낄 수 있는 스팟` },
                        { time: '15:30', place: '소품샵 & 편집샵 거리 구경', desc: '여행의 추억을 간직할 아기자기한 기념품 쇼핑' },
                        { time: '18:30', place: '인기 웨이팅 맛집 저녁', desc: '미리 예약하거나 오픈런으로 즐기는 현지 별미' }
                    ]
                },
                {
                    day: 3,
                    title: '여유로운 힐링과 아쉬운 귀가',
                    summary: '무리하지 않고 여운을 즐기며 마무리하는 마지막 날',
                    activities: [
                        { time: '10:30', place: '숙소 체크아웃 및 조용한 숲길/해변 산책', desc: '여행의 기억을 되새기며 걷는 힐링 타임' },
                        { time: '12:30', place: '공항/역 근처 깔끔한 점심 식사', desc: '이동 동선을 고려한 편안하고 맛있는 한 끼' },
                        { time: '14:30', place: '특산품 베이커리 & 기념품 구매', desc: '주변 지인들에게 선물할 로컬 디저트 포장 후 출발' }
                    ]
                },
                {
                    day: 4,
                    title: '깊이 있는 로컬 문화와 히든 스팟',
                    summary: '3박 4일 일정만의 여유로 만나는 숨겨진 보석 같은 장소들',
                    activities: [
                        { time: '10:00', place: '미술관 또는 복합문화공간 관람', desc: '영감을 채워주는 감각적인 전시와 공간 경험' },
                        { time: '13:00', place: '정갈한 한정식 / 코스 요리', desc: '여행의 대미를 장식하는 특별한 점심 만찬' },
                        { time: '15:30', place: '노을 전망대 & 귀가 준비', desc: '아름다운 풍경을 마지막으로 눈에 담고 복귀' }
                    ]
                }
            ];

            return {
                isMock: true,
                destination: dest,
                days: fullMockDays.slice(0, daysCount)
            };
        }

        // 카드 렌더링 함수
        function renderItinerary(data) {
            itineraryCards.innerHTML = '';
            resultHeader.textContent = `${data.destination} ${state.duration} 추천 코스`;

            // 예시 데이터 여부에 따른 배지/안내 표시
            if (data.isMock) {
                fallbackNotice.classList.remove('hidden');
                demoBadge.classList.remove('hidden');
            } else {
                fallbackNotice.classList.add('hidden');
                demoBadge.classList.add('hidden');
            }

            data.days.forEach((dayItem) => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-3xl border border-slate-200/80 shadow-sm overflow-hidden transition-all hover:shadow-md';

                // 타임라인 아이템 HTML 생성
                const activitiesHtml = dayItem.activities.map((act, idx) => {
                    const isLast = idx === dayItem.activities.length - 1;
                    return `
                        <div class="relative pl-6 ${isLast ? '' : 'pb-5'}">
                            <!-- 타임라인 세로선 -->
                            ${!isLast ? '<div class="absolute left-[7px] top-2.5 bottom-0 w-[2px] bg-indigo-100"></div>' : ''}
                            <!-- 타임라인 점 -->
                            <div class="absolute left-0 top-1.5 w-4 h-4 rounded-full bg-white border-4 border-primary-500"></div>
                            
                            <div class="flex items-baseline gap-2 mb-0.5">
                                <span class="text-xs font-bold text-primary-600 bg-primary-50 px-2 py-0.5 rounded-md">${act.time}</span>
                                <h4 class="text-sm font-bold text-slate-800">${act.place}</h4>
                            </div>
                            <p class="text-xs text-slate-500 leading-relaxed mt-1">${act.desc}</p>
                        </div>
                    `;
                }).join('');

                card.innerHTML = `
                    <div class="bg-gradient-to-r from-slate-900 to-slate-800 px-5 py-4 text-white">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold uppercase tracking-wider text-indigo-300">DAY ${dayItem.day}</span>
                            <span class="text-[11px] bg-white/10 px-2.5 py-0.5 rounded-full text-slate-200">${state.companion}</span>
                        </div>
                        <h3 class="text-base font-bold mt-1">${dayItem.title}</h3>
                        ${dayItem.summary ? `<p class="text-xs text-slate-300 mt-1">${dayItem.summary}</p>` : ''}
                    </div>
                    <div class="p-5">
                        ${activitiesHtml}
                    </div>
                `;

                itineraryCards.appendChild(card);
            });

            // 결과 영역 표시 및 부드러운 스크롤
            resultSection.classList.remove('hidden');
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // 폼 제출 핸들러 (/api/plan 호출 및 폴백 처리)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const destination = destinationInput.value.trim();
            if (!destination) {
                showToast('여행지를 입력해 주세요!');
                destinationInput.focus();
                return;
            }

            // UI 상태: 로딩 시작
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-70', 'cursor-not-allowed');
            resultSection.classList.add('hidden');
            loadingSection.classList.remove('hidden');
            document.getElementById('loading-title').textContent = `${destination} 맞춤 일정을 짜고 있어요...`;

            const payload = {
                destination,
                duration: state.duration,
                companion: state.companion,
                interests: state.interests
            };

            try {
                // Vercel Serverless Function 호출 시도
                const response = await fetch('/api/plan', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json().catch(() => null);

                // 서버가 여행 외 요청 차단 등 명시적인 에러 메시지(400 등)를 보낸 경우
                if (!response.ok) {
                    if (response.status === 400 && data && data.error) {
                        showToast(data.error);
                        return; // 예시 일정으로 넘어가지 않고 여기서 중단
                    }
                    throw new Error(data?.error || `API 응답 오류: ${response.status}`);
                }
                
                // API 응답 데이터 구조 검증 후 렌더링
                if (data && Array.isArray(data.days)) {
                    renderItinerary({
                        isMock: false,
                        destination: data.destination || destination,
                        days: data.days
                    });
                } else {
                    throw new Error('올바르지 않은 일정 데이터 형식입니다.');
                }

            } catch (error) {
                // /api/plan 엔드포인트가 아직 없거나(404) 네트워크 오류 발생 시 예시 일정으로 폴백
                console.info('Vercel API(/api/plan) 연결 대기 중 - 예시 일정을 표시합니다.', error.message);
                
                // 자연스러운 UX를 위한 짧은 딜레이 (0.8초)
                await new Promise(resolve => setTimeout(resolve, 800));
                
                const mockData = getMockItinerary(
                    payload.destination,
                    payload.duration,
                    payload.companion,
                    payload.interests
                );
                renderItinerary(mockData);
            } finally {
                // UI 상태: 로딩 종료
                loadingSection.classList.add('hidden');
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
            }
        });

        // 일정 텍스트 복사 기능 (iFrame 호환 execCommand 사용)
        copyBtn.addEventListener('click', () => {
            const title = resultHeader.textContent;
            const cards = itineraryCards.querySelectorAll('div.bg-white');
            let copyText = `[${title}]\n\n`;

            cards.forEach((card, i) => {
                const dayTitle = card.querySelector('h3').textContent;
                copyText += `■ DAY ${i + 1}: ${dayTitle}\n`;
                const items = card.querySelectorAll('.relative.pl-6');
                items.forEach(item => {
                    const time = item.querySelector('span').textContent;
                    const place = item.querySelector('h4').textContent;
                    const desc = item.querySelector('p').textContent;
                    copyText += `- ${time} ${place} (${desc})\n`;
                });
                copyText += '\n';
            });

            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = copyText;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            try {
                document.execCommand('copy');
                showToast('여행 일정이 클립보드에 복사되었습니다!');
            } catch (err) {
                showToast('복사에 실패했습니다.');
            }
            document.body.removeChild(tempTextArea);
        });
    </script>
</body>
</html>
